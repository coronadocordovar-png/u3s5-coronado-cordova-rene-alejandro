<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Administracion de Servicios</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #222; }
        nav { background: #253858; padding: 18px; }
        nav a { color: white; text-decoration: none; margin-right: 22px; }
        main { max-width: 850px; margin: 35px auto; background: white; padding: 30px; border-radius: 10px; }
        input, textarea, select { display: block; width: 100%; max-width: 550px; padding: 9px; margin-top: 6px; box-sizing: border-box; }
        button { background: #253858; color: white; padding: 11px 18px; border: none; border-radius: 5px; cursor: pointer; }
        main a { display: inline-block; margin-top: 18px; }
        .errorlist { color: #b00020; }
    </style>
</head>
<body>
    <nav>
        <a href='{% url 'inicio' %}'>Inicio</a>
        <a href='{% url 'servicios' %}'>Servicios</a>
        <a href='{% url 'contacto' %}'>Contacto</a>
    </nav>
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
